<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, follow">
<title>הדף לא נמצא — Chordix</title>
<link rel="icon" href="/site.webmanifest" type="application/manifest+json">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
  /* ערכה בהירה — ברירת-המחדל של Chordix (גוון 202°, בלי לבן טהור). */
  :root{
    --page:#b4d3e4; --page2:#c7deec; --panel:#ecf5f9; --edge:#6a9fbe;
    --text:#0f3b57; --dim:#28495e; --a1:#13b6e4; --a2:#48c9e9; --a3:#86dbe9;
    --grad:linear-gradient(100deg,#86dbe9,#48c9e9 50%,#13b6e4);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px 16px; background:var(--page);
    background-image:radial-gradient(1100px 600px at 50% -180px, color-mix(in srgb,var(--a2) 22%,transparent), transparent 70%);
    color:var(--text); line-height:1.6;
    font-family:'Assistant','Rubik',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .card{
    width:100%; max-width:560px; text-align:center;
    background:var(--panel); border:1px solid var(--edge); border-radius:16px;
    padding:44px 32px; box-shadow:0 18px 50px -24px rgba(15,59,87,.45);
  }
  .wordmark{
    font-family:'Heebo','Assistant',system-ui,sans-serif; font-weight:800;
    font-size:26px; letter-spacing:.5px; direction:ltr; display:inline-block; margin-bottom:22px;
    background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .code{
    font-family:'Heebo','Assistant',system-ui,sans-serif; font-weight:800;
    font-size:clamp(64px,18vw,104px); line-height:1; margin:0 0 6px;
    background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  h1{font-family:'Heebo','Assistant',system-ui,sans-serif; font-size:23px; font-weight:700; margin:0 0 10px}
  p{margin:0 auto 26px; max-width:42ch; color:var(--dim); font-size:16.5px}
  .home{
    display:inline-block; text-decoration:none; color:#04222f; font-weight:700; font-size:16px;
    padding:12px 26px; border-radius:8px; background:var(--grad);
    box-shadow:0 8px 22px -10px rgba(19,182,228,.7); transition:transform .16s ease, box-shadow .16s ease;
  }
  .home:hover{transform:translateY(-1px); box-shadow:0 12px 26px -10px rgba(19,182,228,.8)}
  .home:focus-visible{outline:3px solid var(--a1); outline-offset:3px}
  .links{margin-top:26px; padding-top:20px; border-top:1px solid var(--edge); font-size:15px}
  .links a{color:#07516b; text-decoration:none; font-weight:600; margin:0 10px; white-space:nowrap}
  .links a:hover{text-decoration:underline}
  @media (prefers-reduced-motion:reduce){ .home{transition:none} }
</style>
</head>
<body>
  <main class="card">
    <span class="wordmark">Chordix</span>
    <p class="code" aria-hidden="true">404</p>
    <h1>הדף לא נמצא</h1>
    <p>הכתובת שחיפשת לא קיימת באתר — ייתכן שהיא הוסרה, או שהוקלדה לא נכון. אפשר לחזור לדף הבית ולהמשיך משם.</p>
    <a class="home" href="/">חזרה לדף הבית</a>
    <nav class="links" aria-label="קישורים מהירים">
      <a href="/how">איך זה עובד</a>
      <a href="/features">יכולות</a>
      <a href="/faq">שאלות נפוצות</a>
    </nav>
  </main>
</body>
</html>
