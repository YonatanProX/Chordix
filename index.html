<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Chordix — בקרוב</title>
<meta name="description" content="Chordix בשיפוצים. דברים טובים בדרך.">
<meta name="theme-color" content="#0b0e13">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A4%AB%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0e13; --bg2:#11151d; --fg:#eef1f7; --dim:#9aa3b5;
    --acc:#7aa2ff; --acc2:#b98bff; --line:#20263200;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--fg);
    font-family:"Rubik",system-ui,"Segoe UI",Arial,sans-serif;
    min-height:100dvh; display:grid; place-items:center;
    overflow:hidden; position:relative; text-align:center; padding:24px;
  }
  /* הילות רקע רכות שנעות לאט */
  .glow{position:fixed;border-radius:50%;filter:blur(90px);opacity:.5;
        pointer-events:none;z-index:0;animation:drift 18s ease-in-out infinite}
  .glow.a{width:520px;height:520px;background:#3b57c4;top:-140px;inset-inline-start:-120px}
  .glow.b{width:460px;height:460px;background:#7a3bc4;bottom:-160px;inset-inline-end:-120px;animation-delay:-9s}
  @keyframes drift{
    0%,100%{transform:translate(0,0) scale(1)}
    50%{transform:translate(40px,30px) scale(1.12)}
  }
  .card{position:relative;z-index:1;max-width:620px;
        animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}

  .emoji{font-size:88px;line-height:1;display:inline-block;
         animation:sway 4.5s ease-in-out infinite;filter:drop-shadow(0 8px 24px #0008)}
  @keyframes sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}

  .brand{margin-top:18px;font-weight:900;font-size:clamp(38px,9vw,68px);
         letter-spacing:-.02em;
         background:linear-gradient(120deg,var(--acc),var(--acc2));
         -webkit-background-clip:text;background-clip:text;color:transparent}
  h1{margin-top:20px;font-weight:900;font-size:clamp(30px,8vw,58px);
     line-height:1.15;letter-spacing:-.01em}
  p.lead{margin-top:16px;color:var(--dim);font-size:clamp(15px,3.5vw,20px);
         font-weight:400;line-height:1.6}
  .foot{margin-top:34px;color:#5f6880;font-size:13px}
  .dots::after{content:'';animation:dots 1.6s steps(4,end) infinite}
  @keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
</style>
</head>
<body>
  <div class="glow a"></div>
  <div class="glow b"></div>

  <main class="card">
    <div class="emoji" aria-hidden="true">🤫</div>
    <div class="brand">Chordix</div>
    <h1>דברים טובים בדרך<span class="dots"></span></h1>
    <p class="lead">האתר בשיפוצים.<br>אנחנו משפרים את זיהוי האקורדים והמבנה — שווה לחכות.</p>
    <p class="foot">Chordix · דף אקורדים מכל הקלטה</p>
  </main>
</body>
</html>
